global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    product: xspace

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: xspace-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
