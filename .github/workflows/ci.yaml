name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  product-quality:
    name: Responsive and accessibility audits
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Run accessibility source audit
        run: scripts/audit-accessibility.sh
      - name: Run responsive source audit
        env:
          XPACE_SKIP_ROUTE_AUDIT: "1"
        run: scripts/audit-responsive.sh

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit web dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  meeting-lifecycle:
    name: Meeting lifecycle integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Prepare integration configuration
        run: cp .env.example .env
      - name: Start API integration stack
        run: docker compose up -d --build api
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api postgres
          exit 1
      - name: Test create, join, admit, meeting, leave, and end
        run: scripts/integration-test.sh
      - name: Capture integration logs on failure
        if: failure()
        run: docker compose logs api postgres livekit
      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes

  deployment:
    name: Deployment manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Prepare non-production configuration
        run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.proxy.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.edge.yaml config --quiet
      - name: Validate recovery scripts
        run: |
          sh -n scripts/backup.sh
          sh -n scripts/restore-test.sh
          sh -n scripts/restore.sh
          sh -n scripts/onboarding-acceptance.sh
          sh -n scripts/monitor-production.sh
          sh -n scripts/load-test-basic.sh
          sh -n scripts/install-production-monitor.sh
      - name: Verify runtime users
        run: |
          grep -Fq 'USER nextjs' apps/web/Dockerfile
          grep -Fq 'USER xpace' services/api/Dockerfile

  images:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build runtime images
        run: |
          docker build --tag xpace-api:ci services/api
          docker build --tag xpace-web:ci apps/web
      - name: Prepare scanner cache
        run: docker volume create xpace-trivy-cache
      - name: Scan API image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume xpace-trivy-cache:/root/.cache \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress xpace-api:ci
      - name: Scan Web image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume xpace-trivy-cache:/root/.cache \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress xpace-web:ci
